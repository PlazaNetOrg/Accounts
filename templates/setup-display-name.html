{{ define "setup-display-name" }}
<div class="max-w-md mx-auto">
  <h2 class="text-3xl font-bold text-plaza-primary mb-2">
    Welcome, <span class="text-plaza-secondary">@{{ .Username }}</span>!
  </h2>
  <p class="text-plaza-text-muted mb-6">Let's set up your account</p>

  <div class="bg-plaza-surface rounded-xl p-6 mb-6">
    <div class="flex items-center gap-3 mb-4">
      <div class="w-8 h-8 rounded-full bg-plaza-primary text-white flex items-center justify-center font-bold">
        1
      </div>
      <span class="text-plaza-text">Set Display Name</span>
    </div>
    <div class="flex items-center gap-3 opacity-50">
      <div class="w-8 h-8 rounded-full bg-gray-600 text-white flex items-center justify-center font-bold">
        2
      </div>
      <span class="text-plaza-text-muted">Next Steps</span>
    </div>
  </div>

  <form hx-post="/api/setup/display-name" hx-target="#form-result" hx-swap="innerHTML" hx-include="this"
    class="space-y-5">
    <div>
      <label class="block text-sm mb-1">Display Name</label>
      <p class="text-xs text-plaza-text-muted mb-2">
        This is how other users will see you on PlazaNet.
      </p>
      <input type="text" name="display_name" required maxlength="50"
        class="w-full px-4 py-3 bg-plaza-surface border border-gray-600 rounded-xl focus:outline-none focus:border-plaza-primary"
        placeholder="Enter your display name" />
    </div>

    <button type="submit"
      class="w-full bg-plaza-primary hover:bg-plaza-secondary text-white font-medium py-3 px-6 rounded-xl transition">
      Continue to Next Steps &#8594;
    </button>
  </form>

  <div id="form-result" class="mt-4"></div>
</div>
{{ end }}
