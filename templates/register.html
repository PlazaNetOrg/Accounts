{{ define "register" }}
<div class="max-w-md mx-auto">
  <h2 class="text-3xl font-bold text-plaza-primary mb-6">{{ T .Lang "register.title" }}</h2>

  <div id="auth-message" class="mb-4"></div>

  <form hx-post="/api/register" hx-target="#auth-message" hx-swap="innerHTML" hx-include="this" class="space-y-5">
    <div>
      <label class="block text-sm mb-1">{{ T .Lang "auth.email_label" }}</label>
      <input type="email" name="email" required
        class="w-full px-4 py-3 bg-plaza-surface border border-gray-600 rounded-xl focus:outline-none focus:border-plaza-primary">
    </div>

    <div>
      <label class="block text-sm mb-1">{{ T .Lang "auth.username_label" }}</label>
      <input type="text" name="username" required minlength="3" maxlength="20"
        class="w-full px-4 py-3 bg-plaza-surface border border-gray-600 rounded-xl focus:outline-none focus:border-plaza-primary">
    </div>

    <div>
      <label class="block text-sm mb-1">{{ T .Lang "auth.password_label" }}</label>
      <input type="password" name="password" required minlength="6"
        class="w-full px-4 py-3 bg-plaza-surface border border-gray-600 rounded-xl focus:outline-none focus:border-plaza-primary">
    </div>

    <button type="submit"
      class="w-full bg-plaza-primary hover:bg-plaza-secondary text-white font-medium py-3 px-6 rounded-xl transition">
      {{ T .Lang "auth.submit_register" }} &#8594;
    </button>
  </form>

  <p class="mt-6 text-center text-plaza-text-muted">
    {{ T .Lang "register.already_account" }} <a href="/login" class="text-plaza-secondary hover:underline">{{ T .Lang "register.login_link" }} &#8594;</a>
  </p>
</div>

<script>
  document.addEventListener('htmx:afterRequest', function(evt) {
    if (evt.detail.xhr.status >= 400) {
      const errorDiv = document.querySelector('#auth-message');
      if (errorDiv && evt.detail.xhr.responseText) {
        errorDiv.innerHTML = evt.detail.xhr.responseText;
      }
    }
  });
</script>
{{ end }}
