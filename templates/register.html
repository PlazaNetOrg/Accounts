{{ define "register" }}
<div class="max-w-md mx-auto">
  <h2 class="text-3xl font-bold text-plaza-primary mb-6">Create Account</h2>

  <form hx-post="/api/register" hx-target="#form-result" hx-swap="innerHTML" hx-include="this" class="space-y-5">
    <div>
      <label class="block text-sm mb-1">Username</label>
      <input type="text" name="username" required minlength="3" maxlength="20"
        class="w-full px-4 py-3 bg-plaza-surface border border-gray-600 rounded-xl focus:outline-none focus:border-plaza-primary">
    </div>

    <div>
      <label class="block text-sm mb-1">Password</label>
      <input type="password" name="password" required minlength="6"
        class="w-full px-4 py-3 bg-plaza-surface border border-gray-600 rounded-xl focus:outline-none focus:border-plaza-primary">
    </div>

    <button type="submit"
      class="w-full bg-plaza-primary hover:bg-plaza-secondary text-white font-medium py-3 px-6 rounded-xl transition">
      Register &#8594;
    </button>
  </form>

  <div id="form-result" class="mt-4"></div>

  <p class="mt-6 text-center text-plaza-text-muted">
    Already have an account? <a href="/login" class="text-plaza-secondary hover:underline">Login &#8594;</a>
  </p>
</div>
{{ end }}
