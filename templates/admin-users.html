{{define "admin-users"}}
<div class="max-w-7xl mx-auto p-6">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold">User Management</h1>
        <a href="/admin" class="text-plaza-secondary hover:underline">← Back to Dashboard</a>
    </div>
    
    <div class="bg-plaza-surface rounded-lg shadow overflow-hidden">
        <table class="min-w-full divide-y divide-gray-700">
            <thead class="bg-plaza-dark">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">ID</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Username</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Display Name</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Email</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Admin</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Created</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-700">
                {{range .Users}}
                <tr id="user-{{.ID}}">
                    <td class="px-6 py-4 whitespace-nowrap text-sm">{{.ID}}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">{{.Username}}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm">{{.DisplayName}}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm">{{.Email}}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm">
                        {{if .IsAdmin}}
                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-900 text-green-300">Admin</span>
                        {{else}}
                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-gray-700 text-gray-300">User</span>
                        {{end}}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-400">{{.CreatedAt.Format "2006-01-02"}}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                        <button onclick="editUser({{.ID}}, '{{.Email}}', '{{.Username}}', '{{.DisplayName}}', {{.IsAdmin}})" class="text-plaza-secondary hover:text-plaza-primary mr-3">Edit</button>
                        <button 
                            hx-delete="/api/admin/users/{{.ID}}"
                            hx-confirm="Are you sure you want to delete this user?"
                            hx-target="#user-{{.ID}}"
                            hx-swap="outerHTML"
                            class="text-red-400 hover:text-red-300">Delete</button>
                    </td>
                </tr>
                {{end}}
            </tbody>
        </table>
    </div>
</div>

<!-- Edit User Modal -->
<div id="editModal" class="hidden fixed inset-0 bg-black bg-opacity-50 overflow-y-auto h-full w-full">
    <div class="relative top-20 mx-auto p-5 border border-gray-700 w-96 shadow-lg rounded-md bg-plaza-surface">
        <div class="mt-3">
            <h3 class="text-lg font-medium leading-6 mb-4">Edit User</h3>
            <form id="editForm">
                <input type="hidden" id="editUserId">
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-300 mb-1">Email</label>
                    <input type="email" id="editEmail" class="w-full px-3 py-2 bg-plaza-dark border border-gray-600 rounded-md text-white">
                </div>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-300 mb-1">Username</label>
                    <input type="text" id="editUsername" class="w-full px-3 py-2 bg-plaza-dark border border-gray-600 rounded-md text-white">
                </div>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-300 mb-1">Display Name</label>
                    <input type="text" id="editDisplayName" class="w-full px-3 py-2 bg-plaza-dark border border-gray-600 rounded-md text-white">
                </div>
                
                <div class="mb-4">
                    <label class="flex items-center">
                        <input type="checkbox" id="editIsAdmin" class="mr-2">
                        <span class="text-sm font-medium text-gray-300">Is Admin</span>
                    </label>
                </div>
                
                <div class="flex justify-end gap-3">
                    <button type="button" onclick="closeEditModal()" class="px-4 py-2 bg-gray-600 text-white rounded-md hover:bg-gray-700">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-plaza-primary text-white rounded-md hover:bg-plaza-secondary">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
function editUser(id, email, username, displayName, isAdmin) {
    document.getElementById('editUserId').value = id;
    document.getElementById('editEmail').value = email;
    document.getElementById('editUsername').value = username;
    document.getElementById('editDisplayName').value = displayName;
    document.getElementById('editIsAdmin').checked = isAdmin;
    document.getElementById('editModal').classList.remove('hidden');
}

function closeEditModal() {
    document.getElementById('editModal').classList.add('hidden');
}

document.getElementById('editForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('editUserId').value;
    const data = {
        email: document.getElementById('editEmail').value,
        username: document.getElementById('editUsername').value,
        display_name: document.getElementById('editDisplayName').value,
        is_admin: document.getElementById('editIsAdmin').checked
    };
    
    const response = await fetch(`/api/admin/users/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    });
    
    if (response.ok) {
        closeEditModal();
        window.location.reload();
    } else {
        alert('Failed to update user');
    }
});
</script>
{{end}}
