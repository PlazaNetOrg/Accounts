{{ define "pal-editor" }}
<div class="max-w-4xl mx-auto">
  <h2 class="text-3xl font-bold text-plaza-primary mb-6">{{ T .Lang "pal_editor.title" }}</h2>

  <div class="grid md:grid-cols-2 gap-8">
    <!-- Preview area -->
    <div class="bg-plaza-surface rounded-2xl p-8 flex items-center justify-center min-h-[400px]">
      <div id="pal-preview" class="w-64 h-64 bg-gray-700 rounded-full flex items-center justify-center text-6xl">
        👤
      </div>
    </div>

    <!-- Parts -->
    <div class="bg-plaza-surface rounded-2xl p-8">
    </div>
  </div>

  <p class="mt-8 text-center text-plaza-text-muted">
    {{ T .Lang "pal_editor.preview_placeholder" }}
  </p>
</div>
{{ end }}
